services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: german_vocab
      TTS_URL: http://tts:5002
      VOCAB_FILE: /app/data/vocab-data.txt
      OLLAMA_URL: http://ollama:11434
      STT_URL: http://stt:5003
      AI_MODEL: gemma4:e4b      # suggested on the AI page; admins install or switch models there
    volumes:
      - ./data:/app/data        # edit data/vocab-data.txt without rebuilding
      - ollama-models:/ollama-models:ro   # only to show free disk space on the AI page
    depends_on:
      - mongo
      - tts
      - ollama
      - stt
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db     # your progress lives here
    restart: unless-stopped

  tts:
    build: ./tts
    volumes:
      - tts-cache:/cache
    restart: unless-stopped

  # Self-hosted AI (Ollama, CPU only). No model is downloaded until an admin installs one on the AI page.
  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"   # short chats; a long context would need gigabytes of extra RAM
      OLLAMA_NUM_PARALLEL: "1"        # one answer at a time on a small CPU
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 30m          # stays in RAM 30 minutes after the last question, then frees it
    restart: unless-stopped

  # Speech to text (Whisper, free, CPU). Downloads its model (~500 MB) on the first start into stt-models.
  stt:
    build: ./stt
    volumes:
      - stt-models:/models
    restart: unless-stopped

volumes:
  mongo-data:
  tts-cache:
  ollama-models:
  stt-models:
